<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description"
        content="ZeroLogic - Learn Python from zero to hero. A mobile-first platform for college students." />
    <meta name="theme-color" content="#0f0f23" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <title>ZeroLogic - Learn Python Programming</title>
    <script>
        window.onerror = function (message, source, lineno, colno, error) {
            var root = document.getElementById('root');
            root.innerHTML = '<div style="color: red; padding: 20px;">' +
                '<h1>Global Error</h1>' +
                '<p>Message: ' + message + '</p>' +
                '<p>Source: ' + source + '</p>' +
                '<p>Line: ' + lineno + '</p>' +
                '</div>';
        };
    </script>
</head>

<body>
    <div id="root">
        <div
            style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f0f23; color: white; font-family: sans-serif;">
            Loading ZeroLogic...
        </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
