<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description"
        content="ZeroLogic - Learn Python from zero to hero. A mobile-first platform for college students." />
    <meta name="theme-color" content="#0f0f23" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <title>ZeroLogic - Learn Python Programming</title>
    <script>
        // formatting helper
        function logToScreen(type, args) {
            var root = document.getElementById('root');
            var msg = Array.from(args).map(a => {
                try { return typeof a === 'object' ? JSON.stringify(a) : String(a); }
                catch (e) { return String(a); }
            }).join(' ');

            var div = document.createElement('div');
            div.style.padding = '5px';
            div.style.borderBottom = '1px solid #333';
            div.style.color = type === 'error' ? '#ff5555' : '#aaaaaa';
            div.style.fontFamily = 'monospace';
            div.style.fontSize = '12px';
            div.innerText = '[' + type.toUpperCase() + '] ' + msg;

            // Should prompt loading text if it's the first log
            if (root.innerText === 'Loading ZeroLogic...') {
                root.innerHTML = '';
                root.style.display = 'block';
                root.style.height = 'auto';
                root.style.justifyContent = 'flex-start';
                root.style.alignItems = 'flex-start';
                root.style.overflow = 'auto';
            }
            root.appendChild(div);
        }

        var originalLog = console.log;
        var originalError = console.error;

        console.log = function () { originalLog.apply(console, arguments); logToScreen('log', arguments); };
        console.error = function () { originalError.apply(console, arguments); logToScreen('error', arguments); };

        window.onerror = function (message, source, lineno, colno, error) {
            logToScreen('error', [message, source, lineno]);
        };
    </script>
</head>

<body>
    <div id="root">
        <div
            style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f0f23; color: white; font-family: sans-serif;">
            Loading ZeroLogic...
        </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
